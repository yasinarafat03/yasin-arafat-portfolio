                category: 'Hardware Project',

                date: '2023',

                description: `
                    <h2>Project Overview</h2>
                    <p>This project involved designing and implementing a functional 8-bit Arithmetic Logic Unit (ALU) with an integrated ALU Control Unit. The ALU is a fundamental component in computer processors that performs arithmetic and logic operations.</p>
                    
                    <h2>Technical Details</h2>
                    <p>The ALU was designed to perform the following operations:</p>
                    <ul>
                        <li>Arithmetic operations: Addition, Subtraction, Increment, Decrement</li>
                        <li>Logic operations: AND, OR, XOR, NOT</li>
                        <li>Comparison operations: Equal, Not Equal</li>
                    </ul>
                    
                    <h2>Implementation</h2>
                    <p>The project was implemented using logic gates and multiplexers on a breadboard. The ALU Control Unit was designed to decode operation codes and select the appropriate operation to be performed.</p>
                    
                    <h2>Challenges and Solutions</h2>
                    <p>One of the main challenges was managing the complexity of the control unit. This was addressed by breaking down the control logic into smaller, manageable components and using a systematic approach to design and testing.</p>
                `,
                demoLink: '#',
                codeLink: '#'
            },

                    <p>CPUSH is a mobile application designed to simulate CPU scheduling algorithms and deadlock detection in operating systems. This educational tool helps students visualize and understand these complex concepts.</p>
                    
                    <h2>Features</h2>
                    <ul>
                        <li>Simulation of various CPU scheduling algorithms (FCFS, SJF, Priority, Round Robin)</li>
                        <li>Interactive process creation and parameter adjustment</li>
                        <li>Real-time visualization of process execution</li>
                        <li>Deadlock detection and prevention strategies</li>
                        <li>Performance metrics calculation and comparison</li>
                    </ul>
                    
                    <h2>Technical Implementation</h2>
                    <p>The application was developed using React Native for cross-platform compatibility. The backend logic for scheduling algorithms was implemented in JavaScript, with a focus on efficiency and accuracy.</p>
                    
                    <h2>Educational Impact</h2>
                    <p>This project has been used as a teaching aid in operating systems courses, helping students better understand abstract concepts through interactive visualization.</p>
                `,
                demoLink: '#',
                codeLink: '#'
            },

                category: 'Web Development',

                date: '2022',
                image: './images/e-commerce.jpg',

                        <li>Role-based access for students, teachers, and administrators</li>

                        <li>Automated attendance reports and statistics</li>
                        <li>Notification system for attendance alerts</li>
                        <li>Integration with academic calendars</li>

                    <p>The system was developed using the MERN stack (MongoDB, Express.js, React.js, Node.js). The database was designed to efficiently store and retrieve attendance records while maintaining data integrity.</p>

                    <p>This system significantly reduced the time required for attendance management and provided valuable insights into student attendance patterns, helping institutions improve their educational processes.</p>

                codeLink: '#'

                    <h2>Project Overview</h2>
                    <p>A system designed to monitor and ensure the integrity of online classes. This project addresses the challenges of maintaining academic honesty and engagement in virtual learning environments.</p>
                    
                    <h2>Key Features</h2>
                    <ul>
                        <li>Real-time monitoring of multiple students</li>

                        <li>Automated alerts for instructors</li>

                    <h2>Project Overview</h2>
                    <p>This project involved designing and implementing a seven-segment display system controlled by sequential circuits. The system demonstrates fundamental concepts in digital logic design and sequential circuit implementation.</p>
                    
                    <h2>Technical Details</h2>
                    <p>The project consists of:</p>
                    <ul>
                        <li>Sequential circuit design using flip-flops</li>
                        <li>Combinational logic for segment control</li>
                        <li>Counter implementation for digit sequencing</li>
                        <li>Timing and synchronization considerations</li>
                    </ul>
                    
                    <h2>Implementation Process</h2>
                    <p>The circuit was designed using logic gates and flip-flops, then implemented on a breadboard. The design process included creating truth tables, Karnaugh maps for optimization, and timing diagrams for verification.</p>
                    
                    <h2>Learning Outcomes</h2>
                    <p>This project provided hands-on experience with digital logic design, sequential circuits, and the practical challenges of hardware implementation.</p>

                    <h2>Project Overview</h2>
                    <p>An IoT-based smoke detection system designed for enhanced safety and real-time monitoring. This project demonstrates the application of embedded systems and IoT technology in creating practical safety solutions.</p>
                    
                    <h2>Features</h2>
                    <ul>
                        <li>Real-time smoke detection using MQ-2 sensor</li>
                        <li>Wireless alerts via Wi-Fi connection</li>
                        <li>Battery backup for continuous operation</li>
                        <li>Mobile app integration for remote monitoring</li>
                        <li>Data logging for incident analysis</li>
                    </ul>
                    
                    <h2>Technical Implementation</h2>
                    <p>The system uses an ESP32 microcontroller for processing and connectivity. The smoke sensor data is processed locally, with alerts sent to a cloud server and mobile application when thresholds are exceeded.</p>

                    <p>Planned improvements include integration with smart home systems, machine learning for false alarm reduction, and expansion to detect other hazardous gases.</p>

        if (projectId && projects[projectId]) {

            document.getElementById('project-title').textContent = project.title;
            document.getElementById('project-category').textContent = project.category;
            document.getElementById('project-tech').textContent = project.tech;
            document.getElementById('project-date').textContent = project.date;
            document.getElementById('project-image').src = project.image;
            document.getElementById('project-image').alt = project.title;
            document.getElementById('project-description').innerHTML = project.description;
            
            const demoLink = document.getElementById('project-demo-link');
            const codeLink = document.getElementById('project-code-link');
            
            if (project.demoLink && project.demoLink !== '#') {
                demoLink.href = project.demoLink;
            } else {
                demoLink.style.display = 'none';
            }
            
            if (project.codeLink && project.codeLink !== '#') {
                codeLink.href = project.codeLink;
            } else {
                codeLink.style.display = 'none';
            }
        } else {
            // Project not found
            document.getElementById('project-title').textContent = 'Project Not Found';
            document.getElementById('project-description').innerHTML = '<p>Sorry, the requested project could not be found.</p>';
            document.getElementById('project-image').style.display = 'none';
            document.getElementById('project-demo-link').style.display = 'none';
            document.getElementById('project-code-link').style.display = 'none';
        }
